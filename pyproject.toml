[project]
name = "hifi-rip"
version = "0.1.0"
description = "Highest-quality audio extraction from YouTube, with consensus-verified metadata and gapless album splitting."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",     # async fan-out across metadata sources
    "mutagen>=1.47",   # tag and cover-art writing
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",     # offline HTTP fixtures for deterministic CI
]

[project.scripts]
hifi-rip = "hifirip.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hifirip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits the real network; excluded from default CI runs",
]
addopts = "-m 'not live'"
