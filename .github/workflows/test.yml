name: tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is where most users will run this, and the environment and
        # cookie modules take different code paths per platform, so both are
        # worth exercising rather than assuming Linux stands in for both.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # A third of the suite synthesises real audio to test remuxing,
      # splitting and tagging. Without ffmpeg those tests skip silently,
      # which would leave the codec work effectively untested in CI.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Verify ffmpeg is present
        run: ffmpeg -version | head -1 && ffprobe -version | head -1

      # `live` is excluded by pyproject's addopts, so nothing here touches
      # YouTube. Network-dependent behaviour is covered by recorded fixtures;
      # a suite that depends on a third party is a suite that fails for
      # reasons unrelated to the change under test.
      - name: Run tests
        run: pytest -q

      - name: Confirm no test was skipped for a missing tool
        run: pytest -q -rs 2>&1 | tee /tmp/out.txt; ! grep -q "ffmpeg is required" /tmp/out.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
